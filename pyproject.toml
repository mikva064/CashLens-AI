[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cashlens-ai"
version = "0.1.0"
description = "Local video analysis and evidence extraction for CashLens"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["av>=15,<17", "Pillow>=11,<13", "pydantic>=2.11,<3"]

[project.optional-dependencies]
data = ["openpyxl>=3.1,<4"]
service = [
    "fastapi>=0.115", "uvicorn[standard]>=0.34", "python-multipart>=0.0.20",
    "imageio-ffmpeg>=0.5.1",
]
dev = ["pytest>=8.3", "httpx>=0.28", "lm-format-enforcer==0.11.3"]
model = [
    "torch==2.8.0", "torchvision==0.23.0", "transformers==4.57.6",
    "accelerate>=1.10,<2", "bitsandbytes==0.48.2", "huggingface-hub>=0.34,<1",
    "lm-format-enforcer==0.11.3",
]

[project.scripts]
cashlens-ai = "cashlens_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
